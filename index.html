<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salati - صلاتي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9f7;
      color: #222;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #ffffff;
    }

    header h1 {
      margin: 0;
      color: #16845b;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 25px;
      margin-bottom: 20px;
    }

    h2 {
      color: #16845b;
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .btn {
      display: inline-block;
      background: #16845b;
      color: white;
      padding: 14px 25px;
      margin: 10px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .downloads {
      margin: 20px auto;
      padding: 12px 20px;
      background: #ffffff;
      border-radius: 10px;
      font-size: 17px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #download-count {
      font-weight: bold;
      color: #16845b;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      background: #ffffff;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>صلاتي - Salati</h1>

    <a
      class="btn"
      href="https://github.com/SalatiApp/salati-website/releases/download/v1.0.0/Salati.apk"
      download
    >
      تحميل التطبيق
    </a>
  </header>

  <div class="container">

    <img
      src="logo.png"
      alt="Salati Logo"
      class="logo"
    >

    <h2>صلاتي - Salati</h2>

    <p>
      تطبيق إسلامي بسيط يساعدك على متابعة مواقيت الصلاة والأذان،
      القرآن الكريم، أذكار الصباح والمساء والأدعية.
    </p>

    <a
      class="btn"
      href="https://github.com/SalatiApp/salati-website/releases/download/v1.0.0/Salati.apk"
      download
    >
      📥 تحميل Salati مجاناً
    </a>

    <div class="downloads">
      📥 تم تحميل التطبيق
      <span id="download-count">...</span>
      مرة
    </div>

    <p>
      التطبيق مجاني بالكامل.
    </p>

    <a
      class="btn"
      href="https://github.com/SalatiApp/salati-website/releases/download/v1.0.0/Salati.apk"
      download
    >
      📥 تحميل Salati مجاناً
    </a>

  </div>

  <footer>
    <p>© 2026 Salati - صلاتي</p>
    <a href="privacy-policy.html">سياسة الخصوصية</a>
  </footer>


  <script>
    async function getDownloadCount() {
      const countElement = document.getElementById("download-count");

      try {
        const response = await fetch(
          "https://api.github.com/repos/SalatiApp/salati-website/releases/latest"
        );

        if (!response.ok) {
          throw new Error("GitHub API error");
        }

        const release = await response.json();

        const apk = release.assets.find(
          asset => asset.name === "Salati.apk"
        );

        if (apk) {
          countElement.textContent =
            apk.download_count.toLocaleString("ar-MA");
        } else {
          countElement.textContent = "0";
        }

      } catch (error) {
        countElement.textContent = "0";
      }
    }

    getDownloadCount();
  </script>

</body>
</html>
